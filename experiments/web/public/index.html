<!doctype html>
<html lang="de" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RentRadar Austria</title>
  <script>
    (() => {
      let lang = null;
      try { lang = JSON.parse(localStorage.getItem('immo-tool:v1') ?? '{}').lang; } catch {}
      document.documentElement.lang = lang ?? (navigator.language?.toLowerCase().startsWith('de') ? 'de' : 'en');
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23e5484d'/><path d='M8 16l8-7 8 7v8h-5v-5h-6v5H8z' fill='white'/></svg>">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="booting guest">
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">RentRadar <em>Austria</em></span>
    </a>
    <a class="btn topbar-back" href="#/" id="back" data-i18n="backShort">← Zurück</a>
    <div class="status" id="status"></div>
    <div class="lang-switch" role="group" data-i18n-aria="language" id="lang-switch">
      <button type="button" data-lang="de">DE</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <button class="btn btn-primary" id="refresh" type="button" data-i18n-title="refresh">
      <span class="spinner" aria-hidden="true"></span>
      <span class="refresh-icon" aria-hidden="true">↻</span>
      <span class="label" data-i18n="refresh">Aktualisieren</span>
    </button>
    <button class="btn btn-ghost guest-only" id="sign-in" type="button" data-i18n="signIn">Anmelden</button>
    <button class="btn btn-ghost user-menu" id="sign-out" type="button">
      <span class="user-email" id="user-email"></span>
      <span data-i18n="signOut">Abmelden</span>
    </button>
  </header>

  <main class="auth" id="auth" hidden>
    <form class="auth-card" id="auth-form" novalidate>
      <h1 id="auth-title"></h1>
      <p class="auth-lead" id="auth-lead"></p>
      <div class="auth-social" id="auth-social" hidden>
        <button class="btn btn-block btn-google" type="button" id="auth-google">
          <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
          <span data-i18n="continueWithGoogle">Mit Google fortfahren</span>
        </button>
        <div class="auth-divider"><span data-i18n="or">oder</span></div>
      </div>
      <label class="field" id="auth-name-field" hidden>
        <span data-i18n="name">Name</span>
        <input type="text" name="name" autocomplete="name" maxlength="80">
      </label>
      <label class="field">
        <span data-i18n="email">E-Mail</span>
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label class="field">
        <span data-i18n="password">Passwort</span>
        <input type="password" name="password" autocomplete="current-password" minlength="8" required>
      </label>
      <p class="auth-error" id="auth-error" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit" id="auth-submit"></button>
      <button class="link auth-switch" type="button" id="auth-switch"></button>
      <button class="link auth-switch" type="button" id="auth-close" data-i18n="continueAsGuest"></button>
    </form>
  </main>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <form id="prefs" autocomplete="off">
        <h2 data-i18n="search">Suche</h2>

        <fieldset class="field">
          <legend>
            <span data-i18n="region">Region</span>
            <span class="legend-actions">
              <button type="button" class="link" id="states-all" data-i18n="all">Alle</button>
              <button type="button" class="link" id="states-none" data-i18n="none">Keine</button>
            </span>
          </legend>
          <div class="district-grid" id="states"></div>
        </fieldset>

        <fieldset class="field">
          <legend><span data-i18n="type">Objektart</span></legend>
          <div class="segmented" id="types"></div>
        </fieldset>

        <fieldset class="field">
          <legend>
            <span data-i18n="categories">Kategorie</span>
            <button type="button" class="link" id="categories-all" data-i18n="all">Alle</button>
          </legend>
          <div class="source-toggles" id="categories"></div>
        </fieldset>

        <fieldset class="field">
          <legend><span data-i18n="rent">Miete</span></legend>
          <div class="range">
            <div class="input-suffix"><input type="number" name="minPrice" min="0" step="50" data-i18n-placeholder="min"><i>€</i></div>
            <span class="range-sep">–</span>
            <div class="input-suffix"><input type="number" name="maxPrice" min="0" step="50" data-i18n-placeholder="max"><i>€</i></div>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend><span data-i18n="size">Fläche</span></legend>
          <div class="range">
            <div class="input-suffix"><input type="number" name="minArea" min="0" step="5" data-i18n-placeholder="min"><i>m²</i></div>
            <span class="range-sep">–</span>
            <div class="input-suffix"><input type="number" name="maxArea" min="0" step="5" data-i18n-placeholder="max"><i>m²</i></div>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend><span data-i18n="rooms">Zimmer</span></legend>
          <div class="range">
            <input type="number" name="minRooms" min="0" max="50" step="1" data-i18n-placeholder="min">
            <span class="range-sep">–</span>
            <input type="number" name="maxRooms" min="0" max="50" step="1" data-i18n-placeholder="max">
          </div>
        </fieldset>

        <fieldset class="field" id="districts-field">
          <legend>
            <span data-i18n="districts">Bezirke</span>
            <span class="legend-actions">
              <button type="button" class="link" id="districts-all" data-i18n="all">Alle</button>
              <button type="button" class="link" id="districts-none" data-i18n="none">Keine</button>
            </span>
          </legend>
          <div class="district-grid" id="districts"></div>
        </fieldset>

        <fieldset class="field">
          <legend><span data-i18n="sources">Quellen</span></legend>
          <div class="source-toggles" id="sources"></div>
        </fieldset>

        <button class="btn btn-primary btn-block" type="submit" data-i18n="saveSearch">Suchen</button>
        <p class="hint" id="prefs-hint"></p>
      </form>
    </aside>

    <main class="main">
      <section id="list-view">
        <div class="toolbar">
          <button class="btn btn-ghost filters-toggle" id="filters-toggle" type="button" data-i18n="filters">Filter</button>
          <input type="search" id="q" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchLabel">
          <select id="sort" data-i18n-aria="sortLabel">
            <option value="new" data-i18n="sort.new"></option>
            <option value="price-asc" data-i18n="sort.price-asc"></option>
            <option value="price-desc" data-i18n="sort.price-desc"></option>
            <option value="sqm-asc" data-i18n="sort.sqm-asc"></option>
            <option value="area-desc" data-i18n="sort.area-desc"></option>
            <option value="drop" data-i18n="sort.drop"></option>
          </select>
          <div class="chips" role="group" data-i18n-aria="viewLabel">
            <button type="button" class="chip" data-toggle="onlyNew" data-i18n="chip.onlyNew"></button>
            <button type="button" class="chip" data-toggle="onlyDropped" data-i18n="chip.onlyDropped"></button>
            <button type="button" class="chip" data-toggle="onlyMulti" data-i18n="chip.onlyMulti"></button>
            <button type="button" class="chip" data-toggle="onlyFav" data-i18n="chip.onlyFav"></button>          </div>
        </div>
        <p class="result-count" id="result-count"></p>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" hidden></div>
      </section>

      <section id="detail-view" hidden></section>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" hidden>
    <img alt="" referrerpolicy="no-referrer">
    <button class="lb-close" type="button" data-lb="close" data-i18n-aria="close">×</button>
    <button class="lb-nav prev" type="button" data-lb="prev" data-i18n-aria="prevImage">‹</button>
    <button class="lb-nav next" type="button" data-lb="next" data-i18n-aria="nextImage">›</button>
    <span class="lb-count"></span>
  </div>

  <script src="/app.js" type="module"></script>
</body>
</html>
